name: Daily pkgdiffdata update

on:
  schedule:
    - cron: '0 18 * * *' # every day at 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("cranlogs", "remotes"))'
          Rscript -e 'remotes::install_github("dbosak01/common")'
          Rscript -e 'remotes::install_github("dbosak01/pkgdiff")'

      - name: Run update script
        run: Rscript R/Update.R

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data packages.rds LastUpdate.RData
          if ! git diff --cached --quiet; then
            git commit -m "Update pkgdiff data"
            git push
          fi
